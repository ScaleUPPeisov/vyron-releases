name: Verify VYRON 3.3.0 Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: ScaleUPPeisov/vyron-releases
  TAG: v3.3.0
  MAC_DMG_SHA256: 76c096e4c7d0d1cf6802572e90b20ac9ea7d6d1c5dad189864cccf5ec4bf8bdd
  MAC_UPDATER_SHA256: 760c40e3b19931baecd553e7e13289492770d141a33879890a598d890f108381
  WIN_SHA256: 02769159baebb15f9fb06c271b1e1c70df0f1d1f517259ea40d0ff68d8961c5f

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release-only production state
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" > /tmp/release.json
          curl --fail --location --retry 5 "https://raw.githubusercontent.com/$REPO/main/updates/latest.json" -o /tmp/mac.json
          curl --fail --location --retry 5 "https://raw.githubusercontent.com/$REPO/main/updates/windows-latest.json" -o /tmp/win.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          assert r['tag_name']=='v3.3.0' and not r['draft'] and not r['prerelease']
          assets={x['name']:x for x in r['assets']}
          expected={
            'VYRON-3.3.0-arm64.dmg':os.environ['MAC_DMG_SHA256'],
            'VYRON.app.tar.gz':os.environ['MAC_UPDATER_SHA256'],
            'VYRON_3.3.0_x64-setup.exe':os.environ['WIN_SHA256'],
          }
          for name,digest in expected.items():
              assert assets[name]['digest']=='sha256:'+digest,(name,assets[name].get('digest'),digest)
          mac=json.load(open('/tmp/mac.json')); win=json.load(open('/tmp/win.json'))
          assert mac['version']=='3.3.0' and win['version']=='3.3.0'
          for d,key in [(mac,'darwin-aarch64'),(win,'windows-x86_64')]:
              u=d['platforms'][key]['url']
              assert 'ScaleUPPeisov/vyron-releases/releases/download/v3.3.0/' in u
              assert 'scaleup-dashboards' not in u
          print('VYRON_3_3_0_PRODUCTION_VERIFY=PASS')
          PY
